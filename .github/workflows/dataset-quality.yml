name: Dataset quality contract

on:
  pull_request:
    paths:
      - 'tools/nnue/audit_dataset.py'
      - 'tests/test_audit_dataset.py'
      - '.github/workflows/dataset-quality.yml'
  workflow_dispatch:
    inputs:
      dataset_path:
        description: 'Optional repository-relative packed shard to audit'
        required: false
        default: ''
      mode:
        description: 'Legacy structure audit or strict provenance audit'
        type: choice
        options: [structure, strict]
        default: structure
      manifest_path:
        description: 'Repository-relative manifest for strict mode'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess==1.11.2
      - name: Synthetic contract regressions (not strength evidence)
        run: python -m unittest discover -s tests -p 'test_audit_dataset.py' -v
      - name: Audit an explicitly selected existing shard
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dataset_path != '' }}
        env:
          DATASET_PATH: ${{ inputs.dataset_path }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          AUDIT_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          root = Path.cwd().resolve()
          data = (root / os.environ['DATASET_PATH']).resolve()
          if not data.is_relative_to(root) or not data.is_file():
              raise SystemExit('Select an existing file inside the repository')
          command = [sys.executable, 'tools/nnue/audit_dataset.py', str(data), '--out', 'dataset-audit']
          if os.environ['AUDIT_MODE'] == 'structure':
              command.append('--structure-only')
          else:
              manifest = (root / os.environ['MANIFEST_PATH']).resolve()
              if not manifest.is_relative_to(root) or not manifest.is_file():
                  raise SystemExit('Strict mode requires an existing provenance manifest')
              command += ['--manifest', str(manifest)]
          raise SystemExit(subprocess.call(command))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.dataset_path != '' }}
        with:
          name: dataset-quality-report
          path: dataset-audit/
          retention-days: 14
