name: Correctness oracle
# [Agent X1] Independent movegen / UCI correctness check against python-chess.
# Runs on any PR touching src/ or Cargo.*, 5 independent seeds. No Elo claim: this gate
# can only say "the engine's rules/move generation still agree with the reference".
on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/correctness_oracle.py"
      - ".github/workflows/correctness-oracle.yml"
  workflow_dispatch:
    inputs:
      games:
        description: "games per seed"
        default: "40"
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install chess
      - run: cargo build --release
      - name: Oracle
        env:
          GAMES: ${{ github.event.inputs.games || '40' }}
          SEED: ${{ matrix.seed }}
        run: |
          python3 tools/correctness_oracle.py target/release/chess-rust-engine \
            --games "$GAMES" --plies 170 --seed "$SEED" \
            --book tools/openings_book.epd | tee "oracle-$SEED.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-seed-${{ matrix.seed }}
          path: oracle-*.log
