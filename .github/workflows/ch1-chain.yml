name: CH1 chain - SF19-labelled NNUE-generated positions added to TL's data

# Agent CH. EXP-CH1 (experiments/EXP-CH1-chain-sf19-gen2.md). Pre-registered; no Elo claim until the gate says so.
#
# Question: TL (SF19 d12 labels on SD1's HCE self-play positions) beat SD1 by +307. IV's gen-2 positions come from
#   NNUE-driven self-play (a different, stronger position distribution) but are labelled by the gen-1 net. Does adding
#   SF19-labelled gen-2 positions to TL's data make a stronger net than TL?
# Stockfish is the TEACHER here (offline labels). The engine never calls it at runtime.
#
#   prep   : download IV's ivshard-* -> re-run sd_merge EXACTLY (asserts IV's counts) -> every Nth record -> parts
#   relabel: N parallel jobs, tools/teacher/relabel_records.py (unmodified), SF19 sha256 pinned
#   train  : mix (tools/ch/mix_records.py: TL 20M + CH ~10M, evaluation-holdout positions removed) -> tools/nnue/train.py
#            (unmodified, same lam and minutes as TL), game-disjoint teacher-agreement on BOTH holdouts for both nets
#   gate   : CH vs TL (last-known-good) 5 replicates + A/A (TL vs TL); informational: each vs SF19 UCI_Elo 3000 (2 reps)
#   report : pooled numbers auto-posted to issue #1

on:
  push:
    branches: ["agentCH/**"]
    paths: [".github/ch1-params.json"]
  workflow_dispatch:
    inputs:
      iv_run: {description: "IV gen-2 run whose ivshard-* artifacts are the source", default: "43213454181"}
      tl_run: {description: "TL run whose tl-lab-* (labelled data) and tl-net artifacts are the baseline", default: "43226480499"}
      relabel_shards: {description: "Parallel relabel jobs", default: "8"}
      take_every: {description: "Keep every Nth merged IV record (2 -> ~10M)", default: "2"}
      max_records: {description: "Cap passed to sd_merge (20000000 reproduces IV exactly; smaller only with smoke=true)", default: "20000000"}
      depth: {description: "Stockfish 19 fixed depth (never < 10)", default: "12"}
      lam: {description: "Weight of teacher score vs game result", default: "0.75"}
      train_minutes: {description: "Training wall clock", default: "230"}
      gate_games: {description: "Games per h2h replicate (5 + A/A)", default: "100"}
      sf_games: {description: "Games per SF19 UCI_Elo 3000 replicate (2 per net)", default: "100"}
      gate_tc: {description: "Gate time control", default: "10+0.1"}
      smoke: {description: "true = plumbing test, skip IV equality assertions", default: "false"}

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing trainer must not be hidden by `| tee | grep`

permissions:
  contents: read
  issues: write
  actions: read

env:
  FASTCHESS_URL: https://github.com/Disservin/fastchess/releases/download/v1.8.3-alpha/fastchess-linux-x86-64.tar
  SF_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
  SF_BIN_SHA256: 0f83d24cc46d2c66c60f16001af5444873bc112b7d028594513426894c12da19

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.p.outputs.shard_list }}
      iv_run: ${{ steps.p.outputs.iv_run }}
      tl_run: ${{ steps.p.outputs.tl_run }}
      relabel_shards: ${{ steps.p.outputs.relabel_shards }}
      take_every: ${{ steps.p.outputs.take_every }}
      max_records: ${{ steps.p.outputs.max_records }}
      tl_glob: ${{ steps.p.outputs.tl_glob }}
      depth: ${{ steps.p.outputs.depth }}
      lam: ${{ steps.p.outputs.lam }}
      train_minutes: ${{ steps.p.outputs.train_minutes }}
      gate_games: ${{ steps.p.outputs.gate_games }}
      sf_games: ${{ steps.p.outputs.sf_games }}
      gate_tc: ${{ steps.p.outputs.gate_tc }}
      smoke: ${{ steps.p.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          EV: ${{ github.event_name }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p = json.loads(os.environ["INPUTS"]) if os.environ["EV"] == "workflow_dispatch" else json.load(open(".github/ch1-params.json"))
          n, d, te = int(p["relabel_shards"]), int(p["depth"]), int(p["take_every"])
          assert 1 <= n <= 20, n
          assert d >= 10, "teacher labels shallower than depth 10 are too noisy (EXP-P1)"
          assert 0.0 <= float(p["lam"]) <= 1.0 and te >= 1
          if str(p["smoke"]).lower() != "true":
              assert d >= 12 and te == 2 and int(p["max_records"]) == 20000000, "a real run must be the pre-registered configuration (depth >= 12, every 2nd record of IV's 20M)"
              assert int(p["train_minutes"]) >= 230 and int(p["gate_games"]) >= 100, "real run must match TL's recipe and gate size"
          print("shard_list=" + json.dumps(list(range(1, n + 1)) + ["h"]))
          print("tl_glob=" + ("tllab/part_001.bin" if str(p["smoke"]).lower() == "true" else "tllab/part_*.bin"))
          for k in ("iv_run", "tl_run", "relabel_shards", "take_every", "max_records", "depth", "lam", "train_minutes", "gate_games", "sf_games", "gate_tc", "smoke"):
              print(f"{k}={str(p[k]).lower() if k == 'smoke' else p[k]}")
          PY

  prep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy
      - name: Unit test of the mixing tool
        run: python3 tools/ch/mix_records.py --selftest
      - uses: actions/download-artifact@v4
        with:
          pattern: ivshard-*
          path: data
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.iv_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Merge exactly as IV did
        run: |
          free -g | head -2
          python3 tools/sd/sd_merge.py --inp 'data/**/*.bin' --out merged.bin --holdout holdout.bin --max-records ${{ needs.plan.outputs.max_records }} | tee merge.txt
          if [ "${{ needs.plan.outputs.smoke }}" != "true" ]; then
            python3 - <<'PY'
          import json
          s = json.load(open("merged.bin.stats.json"))
          # IV report (issue #1, run 43213454181): these must match or the source data is not the data IV trained on
          want = {"raw_records": 31221601, "train_final": 20000000, "holdout_unique": 774278, "wdl_stm_loss_draw_win_train": [8076931, 4134808, 7788261]}
          for k, v in want.items():
              assert s[k] == v, (k, s[k], v)
          print("PREP OK: merged IV data is identical in size and WDL mix to IV's training set")
          PY
          fi
      - name: Stride-sample and split into ordered parts + a deterministic holdout sample
        run: |
          python3 - <<'PY'
          import numpy as np, os, json
          R = np.dtype([("occ","<u8"),("pcs","u1",(16,)),("stm","u1"),("score","<i2"),("wdl","u1")])
          n_parts = int("${{ needs.plan.outputs.relabel_shards }}"); te = int("${{ needs.plan.outputs.take_every }}")
          a = np.memmap("merged.bin", dtype=R, mode="r")[::te]       # stride keeps games/shards evenly represented
          os.makedirs("parts")
          cuts = np.linspace(0, len(a), n_parts + 1).astype(np.int64)
          for i in range(n_parts):
              np.ascontiguousarray(a[cuts[i]:cuts[i+1]]).tofile(f"parts/part_{i+1:03d}.bin")
          h = np.fromfile("holdout.bin", dtype=R)
          sub = h[::max(1, len(h) // 100000)][:100000]       # stride sample of IV's GAME-DISJOINT holdout, <= 100k
          sub.tofile("parts/hold_sub.bin")
          json.dump({"parts": n_parts, "take_every": te, "train_records": int(len(a)), "holdout_sub": int(len(sub))}, open("parts/split.json", "w"))
          print(open("parts/split.json").read())
          PY
          ls -la parts | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: ch-parts
          path: parts/
          retention-days: 14
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: ch-prep-report
          path: |
            merge.txt
            merged.bin.stats.json
          retention-days: 30

  relabel:
    needs: [plan, prep]
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy chess
      - uses: actions/download-artifact@v4
        with: {name: ch-parts, path: parts}
      - name: Fetch and verify the pinned Stockfish 19
        run: |
          mkdir -p /tmp/sfdl && curl -fsSL --retry 3 "$SF_URL" -o /tmp/sfdl/sf.tar.gz && tar xzf /tmp/sfdl/sf.tar.gz -C /tmp/sfdl
          SF=$(find /tmp/sfdl -type f -name 'stockfish-*' ! -name '*.tar.gz' | head -1); test -n "$SF"; chmod +x "$SF"
          echo "$SF_BIN_SHA256  $SF" | sha256sum -c -
          echo "SF=$SF" >> "$GITHUB_ENV"
      - name: Unit tests (incl. end-to-end on real SF19)
        run: python3 tools/teacher/test_relabel_records.py --stockfish "$SF"
      - name: Relabel (shard ${{ matrix.shard }})
        run: |
          mkdir -p lab
          if [ "${{ matrix.shard }}" = "h" ]; then IN=parts/hold_sub.bin; OUT=lab/hold_sub.bin; else N=$(printf '%03d' ${{ matrix.shard }}); IN=parts/part_$N.bin; OUT=lab/part_$N.bin; fi
          python3 tools/teacher/relabel_records.py --stockfish "$SF" --in "$IN" --out "$OUT" --depth ${{ needs.plan.outputs.depth }} --procs 4 2>&1 | tail -n 40
      - uses: actions/upload-artifact@v4
        with:
          name: ch-lab-${{ matrix.shard }}
          path: lab/
          retention-days: 14
          compression-level: 1

  train:
    needs: [plan, relabel]
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {pattern: ch-lab-*, path: lab, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with:
          pattern: tl-lab-*
          path: tllab
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.tl_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - uses: actions/download-artifact@v4
        with:
          name: tl-net
          path: tlnet
          run-id: ${{ needs.plan.outputs.tl_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Install deps
        run: |
          pip install numpy chess
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Mix TL 20M + CH data (evaluation-holdout positions removed) and audit
        env:
          SMOKE: ${{ needs.plan.outputs.smoke }}
        run: |
          ls lab | head -30; ls tllab | head -30
          if [ "${{ needs.plan.outputs.smoke }}" != "true" ]; then test "$(ls tllab/part_*.bin | wc -l)" = "16" || { echo "expected TL's 16 labelled parts"; exit 1; }; fi
          python3 tools/ch/mix_records.py --selftest
          python3 tools/ch/mix_records.py --a '${{ needs.plan.outputs.tl_glob }}' --b 'lab/part_*.bin' --hold tllab/hold_sub.bin lab/hold_sub.bin --out labelled.bin --report mix.json
          python3 - <<'PY'
          import numpy as np, json, glob
          R = np.dtype([("occ","<u8"),("pcs","u1",(16,)),("stm","u1"),("score","<i2"),("wdl","u1")])
          a = np.fromfile("labelled.bin", dtype=R)
          prov = [json.load(open(p)) for p in sorted(glob.glob("lab/part_*.bin.provenance.json"))]
          tlp = [json.load(open(p)) for p in sorted(glob.glob("tllab/part_*.bin.provenance.json"))]  # (smoke uses part_001 only; same teacher either way)
          assert len({p["stockfish_sha256"] for p in prov + tlp}) == 1, "mixed teacher binaries between TL and CH labels"
          import os
          if os.environ.get("SMOKE") != "true":   # smoke labels at depth 10 on purpose; a real run must not mix depths
              assert all(p["depth"] == prov[0]["depth"] for p in prov + tlp), "mixed teacher depths"
          drop = {k: sum(p["dropped"][k] for p in prov) for k in prov[0]["dropped"]}
          rep = {"records": int(len(a)), "ch_dropped_by_relabel": drop, "teacher": prov[0]["teacher"], "stockfish_sha256": prov[0]["stockfish_sha256"][:16],
                 "depth": prov[0]["depth"], "abs_score_lt50_frac": float((np.abs(a["score"]) < 50).mean()), "wdl_train": np.bincount(a["wdl"], minlength=3).tolist(),
                 "mix": json.load(open("mix.json"))}
          json.dump(rep, open("labelled.audit.json", "w"), indent=1); print(json.dumps(rep, indent=1))
          PY
          free -g | head -2
      - name: Train (tools/nnue/train.py, unchanged)
        run: |
          python3 tools/nnue/train.py --data labelled.bin --out net.bin --lam ${{ needs.plan.outputs.lam }} \
            --minutes ${{ needs.plan.outputs.train_minutes }} > train.log 2>&1 || { echo "TRAINER FAILED:"; tail -n 40 train.log; exit 1; }
          grep -E "files|decoded|==|final|exported" train.log | tail -60
          test -s net.bin || { echo "no net.bin produced"; tail -n 40 train.log; exit 1; }
      - name: Teacher agreement on BOTH game-disjoint labelled holdout samples (CH net and TL net, same data)
        run: |
          for H in tllab/hold_sub.bin lab/hold_sub.bin; do
            for N in net.bin tlnet/net.bin; do
              echo "== holdout=$H net=$N sha=$(sha256sum $N | cut -c1-12)"
              python3 tools/sd/holdout_eval.py --net $N --holdout $H --lam ${{ needs.plan.outputs.lam }} --json /tmp/h.json
            done
          done 2>&1 | tee holdout_teacher.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ch-net
          path: |
            net.bin
            net.bin.parity.txt
            train.log
            labelled.audit.json
            holdout_teacher.txt
            mix.json
          retention-days: 30

  gate:
    needs: [plan, train]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: "1", kind: h2h, seed: 1013}
          - {id: "2", kind: h2h, seed: 2026}
          - {id: "3", kind: h2h, seed: 3039}
          - {id: "4", kind: h2h, seed: 4052}
          - {id: "5", kind: h2h, seed: 5065}
          - {id: aa, kind: aa, seed: 777}
          - {id: chsf1, kind: sf, net: ch, seed: 4242}
          - {id: chsf2, kind: sf, net: ch, seed: 7777}
          - {id: tlsf1, kind: sf, net: tl, seed: 4242}
          - {id: tlsf2, kind: sf, net: tl, seed: 7777}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with: {name: ch-net, path: chnet}
      - uses: actions/download-artifact@v4
        with:
          name: tl-net
          path: tlnet
          run-id: ${{ needs.plan.outputs.tl_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Build engine, fastchess, Stockfish 19
        run: |
          cargo build --release
          cp target/release/chess-rust-engine ./engine
          echo "bench (HCE):    $(printf 'setoption name UseNNUE value false\nbench 10\nquit\n' | ./engine | grep ' nps' | tail -1)"
          echo "bench (CH net): $(printf 'setoption name UseNNUE value true\nbench 10\nquit\n' | CRE_NNUE_FILE=$PWD/chnet/net.bin ./engine | grep ' nps' | tail -1)"
          echo "bench (TL net): $(printf 'setoption name UseNNUE value true\nbench 10\nquit\n' | CRE_NNUE_FILE=$PWD/tlnet/net.bin ./engine | grep ' nps' | tail -1)"
          mkdir -p /tmp/fc && curl -fsSL --retry 3 "$FASTCHESS_URL" -o /tmp/fc.tar && tar xf /tmp/fc.tar -C /tmp/fc
          FC=$(find /tmp/fc -type f -name fastchess | head -1); chmod +x "$FC"; ln -sf "$FC" /tmp/fastchess
          mkdir -p /tmp/sfdl && curl -fsSL --retry 3 "$SF_URL" -o /tmp/sfdl/sf.tar.gz && tar xzf /tmp/sfdl/sf.tar.gz -C /tmp/sfdl
          SF=$(find /tmp/sfdl -type f -name 'stockfish-*' ! -name '*.tar.gz' | head -1); test -n "$SF"; chmod +x "$SF"
          echo "$SF_BIN_SHA256  $SF" | sha256sum -c -
          echo "SF=$SF" >> "$GITHUB_ENV"
      - name: Assert both nets really load (the engine silently falls back to HCE otherwise)
        run: |
          test -s chnet/net.bin && test -s tlnet/net.bin
          if cmp -s chnet/net.bin tlnet/net.bin; then echo "CH net is byte-identical to TL: refusing to run a disguised A/A"; exit 1; fi
          for N in chnet tlnet; do
            OUT=$(printf 'position startpos moves e2e4 e7e5\neval\nquit\n' | CRE_NNUE_FILE=$PWD/$N/net.bin ./engine 2>&1)
            echo "$N: $(echo "$OUT" | grep -E 'eval_nnue|NNUE file' | tr '\n' ' ')"
            echo "$OUT" | grep -q 'eval_nnue none' && { echo "$N did not load"; exit 1; } || true
            echo "$OUT" | grep -q 'NNUE file' && { echo "$N failed to parse"; exit 1; } || true
          done
      - name: Gate (${{ matrix.id }}, ${{ matrix.kind }})
        run: |
          mkdir -p gate_out
          for W in ch tl; do
            cat > gate_out/$W.sh <<WRAP
          #!/usr/bin/env bash
          export CRE_NNUE_FILE="$PWD/${W}net/net.bin"
          exec "$PWD/engine" "\$@"
          WRAP
            chmod +x gate_out/$W.sh
          done
          SEED=${{ matrix.seed }}; TC="${{ needs.plan.outputs.gate_tc }}"
          COMMON="-openings file=tools/openings_book.epd format=epd order=random -srand $SEED -games 2 -repeat -concurrency 3 -pgnout file=gate_out/games.pgn -recover -ratinginterval 10"
          case "${{ matrix.kind }}" in
            h2h) G=${{ needs.plan.outputs.gate_games }}
                 /tmp/fastchess -engine name=CH cmd=$PWD/gate_out/ch.sh option.UseNNUE=true option.Hash=64 \
                   -engine name=TL cmd=$PWD/gate_out/tl.sh option.UseNNUE=true option.Hash=64 \
                   -each tc="$TC" $COMMON -rounds $(( G / 2 )) 2>&1 | tee gate_out/gate.log | tail -n 12 ;;
            aa)  G=${{ needs.plan.outputs.gate_games }}
                 /tmp/fastchess -engine name=TL cmd=$PWD/gate_out/tl.sh option.UseNNUE=true option.Hash=64 \
                   -engine name=TLB cmd=$PWD/gate_out/tl.sh option.UseNNUE=true option.Hash=64 \
                   -each tc="$TC" $COMMON -rounds $(( G / 2 )) 2>&1 | tee gate_out/gate.log | tail -n 12 ;;
            sf)  G=${{ needs.plan.outputs.sf_games }}
                 NAME=$( [ "${{ matrix.net }}" = ch ] && echo CH || echo TL )
                 /tmp/fastchess -engine name=$NAME cmd=$PWD/gate_out/${{ matrix.net }}.sh option.UseNNUE=true option.Hash=64 \
                   -engine name=SF19 cmd="$SF" option.UCI_LimitStrength=true option.UCI_Elo=3000 option.Hash=64 option.Threads=1 \
                   -each tc="$TC" $COMMON -rounds $(( G / 2 )) 2>&1 | tee gate_out/gate.log | tail -n 12 ;;
          esac
          echo "config: kind=${{ matrix.kind }} id=${{ matrix.id }} engine_sha=$(sha256sum engine | cut -c1-12) ch_net_sha=$(sha256sum chnet/net.bin | cut -c1-12) tl_net_sha=$(sha256sum tlnet/net.bin | cut -c1-12) sf_bin_sha=${SF_BIN_SHA256:0:12} book_sha=$(sha256sum tools/openings_book.epd | cut -c1-12) tc=$TC srand=$SEED hash=64 threads=1 runner=$(nproc)vCPU" | tee gate_out/config.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ch-gate-${{ matrix.id }}
          path: gate_out/
          retention-days: 30

  report:
    needs: [plan, train, gate]
    if: ${{ always() && needs.train.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: ch-*, path: art}
      - name: Pool and post
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R art | head -80
          python3 tools/sd/pool_gate.py art/ch-gate-[1-5]/gate.log --aa art/ch-gate-aa/gate.log --json pooled.json | tee pooled.txt
          python3 tools/sd/pool_gate.py art/ch-gate-chsf1/gate.log art/ch-gate-chsf2/gate.log --json sf_ch.json | tee sf_ch.txt || true
          python3 tools/sd/pool_gate.py art/ch-gate-tlsf1/gate.log art/ch-gate-tlsf2/gate.log --json sf_tl.json | tee sf_tl.txt || true
          {
            echo "## Agent CH: EXP-CH1 result (run ${{ github.run_id }}) - machine-generated, numbers copied verbatim"
            echo
            echo "Ref \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`; IV source run \`${{ needs.plan.outputs.iv_run }}\`; TL baseline run \`${{ needs.plan.outputs.tl_run }}\`; teacher SF19 depth ${{ needs.plan.outputs.depth }} (sha256 \`${SF_BIN_SHA256:0:16}\`); lam ${{ needs.plan.outputs.lam }}; smoke=${{ needs.plan.outputs.smoke }}; h2h ${{ needs.plan.outputs.gate_games }} games x 5 + A/A at ${{ needs.plan.outputs.gate_tc }}."
            echo
            echo '**CH net (TL data + SF19-labelled IV positions) vs TL net (last-known-good):**'
            echo '```'; cat pooled.txt; echo '```'
            echo '**Informational, each net vs SF19 UCI_Elo 3000 (2 replicates):**'
            echo '```'; echo "CH:"; cat sf_ch.txt; echo "TL:"; cat sf_tl.txt; echo '```'
            echo '**Data audit / training / teacher agreement:**'
            echo '```'
            cat art/ch-prep-report/merged.bin.stats.json | python3 -c "import json,sys;d=json.load(sys.stdin);d.pop('shards',None);print(json.dumps(d))" || true
            cat art/ch-net/labelled.audit.json 2>/dev/null | python3 -c "import json,sys;print(json.dumps(json.load(sys.stdin)))" || true
            grep -h "final val_loss" art/ch-net/train.log || true
            cat art/ch-net/holdout_teacher.txt 2>/dev/null | grep -E "==|mse|explained" || true
            cat art/ch-gate-1/config.txt art/ch-gate-chsf1/config.txt 2>/dev/null || true
            echo '```'
            echo "Pre-registered rule (docs: experiments/EXP-CH1-chain-sf19-gen2.md, fixed before any game): REPLACES-TL iff pooled CH-vs-TL >= 52% with LOS >= 97.5%, >= 4/5 replicates > 50%, A/A inside its CI of 50%, AND no downside: CH's SF19-3000 score is not lower than TL's by more than the pair's combined 95% error. Anything else: TL stays best-known, result recorded as is. A smoke run proves plumbing only."
          } > comment.md
          gh issue comment 1 --repo ${{ github.repository }} --body-file comment.md || true
      - uses: actions/upload-artifact@v4
        with:
          name: ch-report
          path: |
            pooled.json
            pooled.txt
            sf_ch.txt
            sf_tl.txt
            comment.md
