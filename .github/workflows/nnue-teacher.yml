name: NNUE teacher (SF19 MAX ≥500ms)

# Position labels from official Stockfish 19 at FULL strength.
# Never 100–120 ms. Floor is 0.5 s/pos (go movetime 500).
# 20k-node games are ~26 ms on this hardware — forbidden.

on:
  workflow_dispatch:
    inputs:
      per_shard:
        description: "Positions to SF-label per shard (0.5s each ≈ 17 min for 2000)"
        default: "1500"
      movetime:
        description: "Seconds per position (≥ 0.5)"
        default: "0.5"
      datagen:
        description: "Self-play positions to generate per shard before sampling"
        default: "6000"

permissions:
  contents: read

concurrency:
  group: nnue-teacher-${{ github.ref }}
  cancel-in-progress: false

env:
  SF19_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          cargo build --release
          test -x target/release/chess-rust-engine

      - name: Stockfish 19
        run: |
          mkdir -p /tmp/sf
          curl -fsSL --retry 3 "$SF19_URL" | tar xz -C /tmp/sf
          SF=$(find /tmp/sf -type f -name 'stockfish-linux-x86-64-universal' | head -1)
          chmod +x "$SF"
          ln -sf "$SF" /tmp/sf19
          printf 'uci\nquit\n' | /tmp/sf19 | grep 'id name'
          pip install chess -q

      - name: Datagen (HCE search) + SF19 MAX labels ≥500ms
        env:
          CRE_NO_NNUE: "1"
        run: |
          MT="${{ inputs.movetime || '0.5' }}"
          python3 - <<'PY'
          import sys
          mt=float("${{ inputs.movetime || '0.5' }}")
          if mt < 0.5:
              print("refusing movetime", mt, "< 0.5", file=sys.stderr)
              sys.exit(2)
          PY
          mkdir -p out
          ./target/release/chess-rust-engine datagen ${{ inputs.datagen || '6000' }} 6 out/sp.jsonl
          python3 tools/relabel_sf.py out/sp.jsonl \
            --stockfish /tmp/sf19 \
            --out out/sf19.jsonl \
            --movetime "$MT" \
            --limit ${{ inputs.per_shard || '1500' }} \
            --hash-mb 64
          wc -l out/sf19.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: teacher-shard-${{ matrix.shard }}
          path: out/sf19.jsonl
          retention-days: 14
